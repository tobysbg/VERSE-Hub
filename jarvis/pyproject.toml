[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-assistant"
version = "0.1.0"
description = "JARVIS - a Windows-first desktop AI assistant with a futuristic HUD and a safety-gated tool-using agent."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.6",
    "pydantic>=2.5",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools]
packages = [
    "jarvis",
    "jarvis.app",
    "jarvis.ui",
    "jarvis.agent",
    "jarvis.llm",
    "jarvis.tools",
    "jarvis.voice",
    "jarvis.storage",
]

[tool.pytest.ini_options]
testpaths = ["jarvis/tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
